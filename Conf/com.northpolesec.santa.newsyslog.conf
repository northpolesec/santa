# If the TelemetryFileMode config key is set, update the mode column below to match the mode
# Santa actually applies: the configured value after sanitizing (see the telemetry docs), which
# may be narrower than what was configured.
# Santa re-applies that mode when it reopens the log after a rotation, but newsyslog
# creates the replacement file with the mode given here.
# logfilename             [owner:group]       mode   count size(KiB) when   flags [/pid_file] # [sig_num]
/var/db/santa/santa.log   root:wheel          644    10    25000     *      Z
