# If you set the TelemetryFileMode config key, change the mode column below to match the mode
# that Santa applies. Santa changes the configured mode before it applies the mode, so the two
# can differ. The telemetry documentation gives the rules.
# Santa applies its mode again when it opens the log after a rotation. But newsyslog makes the
# new log file with the mode in this file.
# logfilename             [owner:group]       mode   count size(KiB) when   flags [/pid_file] # [sig_num]
/var/db/santa/santa.log   root:wheel          644    10    25000     *      Z
