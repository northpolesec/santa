name: Process PRs

# pull_request_target, not pull_request: santa is public, so a fork's PR runs with a
# read-only GITHUB_TOKEN that a job's `permissions:` block cannot elevate, and the labeler
# fails with "Resource not accessible by integration". Running in the base repo's context
# gets a writable token. Safe only because nothing here checks out or runs the PR's code:
# both actions read PR metadata over the API, and actions/labeler fetches its config at
# github.sha, which is the base branch, so the config is ours and not the PR author's.
on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    name: Labelers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read .github/labeler-pr.yml from the base ref
      pull-requests: write # apply the labels

    steps:
      - name: Apply Labels
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # ratchet:actions/labeler@v6
        with:
          configuration-path: .github/labeler-pr.yml

      - name: Apply Size Labels
        uses: codelytv/pr-size-labeler@4ec67706cd878fbc1c8db0a5dcd28b6bb412e85a # ratchet:codelytv/pr-size-labeler@v1.10.3
